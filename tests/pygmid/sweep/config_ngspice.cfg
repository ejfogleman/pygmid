[MODEL]
# Optional; selects the simulator backend to use. Defaults to 'spectre' if
# omitted (see pygmid.sweep.SIMULATOR_REGISTRY for available backends).
simulator = ngspice
# Generic BSIM4 device, not tied to any particular PDK -- see
# generic_bsim4.lib. No LIBNAME key here since this file has no
# `.lib ... .endl` wrapper (a plain `.include` is used instead).
file = generic_bsim4.lib
info = Generic BSIM4 (non-PDK-specific), for ngspice backend testing
corner = TT
temp = 300
modeln = generic_nmos
modelp = generic_pmos
savefilen = ngspice_test_n
savefilep = ngspice_test_p
paramfile = params.lib
mn = []
mp = []

[SWEEP]
#	(start	,step,stop)
VGS = (0,0.6,1.8)
VDS = (0,0.9,1.8)
VSB = (0,0.5,0.5)
LENGTH = [(1,0.5,1)]
WIDTH = 10
NFING = 1
