[MODEL]
# Selects the NgspiceGf180Config backend (see
# pygmid.sweep.SIMULATOR_REGISTRY). `file`/`libname`/`extra_include` point
# at placeholders here since these are shape-only unit tests that never
# actually run ngspice or open these files from Python -- real end-to-end
# runs point at the real gf180mcuD PDK instead (gated behind its presence,
# see test_subcircuit_ngspice_config.py).
simulator = ngspice_gf180
file = model.lib
libname = typical
extra_include = ["design.lib"]
info = gf180mcuD nfet_03v3/pfet_03v3, for subcircuit ngspice backend testing
corner = TT
temp = 300
modeln = nfet_03v3
modelp = pfet_03v3
savefilen = gf180_test_n
savefilep = gf180_test_p
paramfile = params.lib
mn = ["m=1"]
mp = ["m=1"]

[SWEEP]
#	(start	,step,stop)
VGS = (0,0.6,1.8)
VDS = (0,0.9,1.8)
VSB = (0,0.5,0.5)
LENGTH = [(0.28,0.5,0.28)]
WIDTH = 0.97
NFING = 1
