[MODEL]
# Selects the NgspiceSky130Config backend (see
# pygmid.sweep.SIMULATOR_REGISTRY). `file`/`libname` point at a
# placeholder here since these are shape-only unit tests that never
# actually run ngspice or open this file from Python -- real end-to-end
# runs point at the real sky130 PDK instead (gated behind its presence,
# see test_subcircuit_ngspice_config.py).
simulator = ngspice_sky130
file = model.lib
libname = tt
info = sky130_fd_pr__nfet_01v8/pfet_01v8, for subcircuit ngspice backend testing
corner = TT
temp = 300
modeln = sky130_fd_pr__nfet_01v8
modelp = sky130_fd_pr__pfet_01v8
savefilen = sky130_test_n
savefilep = sky130_test_p
paramfile = params.lib
mn = []
mp = []

[SWEEP]
#	(start	,step,stop)
VGS = (0,0.6,1.8)
VDS = (0,0.9,1.8)
VSB = (0,0.5,0.5)
LENGTH = [(0.18,0.5,0.18)]
WIDTH = 0.97
NFING = 1
